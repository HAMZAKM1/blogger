{% extends "users/base.html" %}
{% block title %}Email Sent{% endblock %}
{% block content %}
<div class="container my-5">
  <div class="card shadow-lg bg-dark text-white glassmorphic p-4 mx-auto" style="max-width: 500px;">
    <h2 class="text-center mb-3">📧 Email Sent</h2>
    <p>If the email you entered is registered, a password reset link has been sent. Please check your inbox.</p>
    <a href="{% url 'users:login' %}" class="btn btn-primary w-100 mt-3">🔙 Back to Login</a>
  </div>
</div>
{% endblock %}
